<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Vite does not use %PUBLIC_URL% -->

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using React + Vite" />

    <!--
    Runtime environment variables
    These values are:
    - replaced in DEV by Vite (via import.meta.env if needed)
    - replaced in PROD by Docker entrypoint (string replace)
  -->
    <script>
      window.__ENV = {
        backendURL: "$$BACKEND_URL$$",
        appWalletAddress: "$$APP_WALLET_ADDRESS$$",
      };
    </script>

    <!-- Official Pi SDK: load once and wait for initialization -->
    <script>
      window.__PI_READY = new Promise((resolve, reject) => {
        const loadSDK = (attempt = 1) => {
          const script = document.createElement("script");
          script.src = "https://sdk.minepi.com/pi-sdk.js";
          script.async = true;

          script.onload = async () => {
            try {
              if (!window.Pi) {
                throw new Error("Pi SDK loaded but window.Pi is unavailable");
              }
              await window.Pi.init({ version: "2.0" });
              console.info("Pi SDK initialized successfully");
              resolve(window.Pi);
            } catch (error) {
              reject(error);
            }
          };

          script.onerror = () => {
            script.remove();
            if (attempt < 3) {
              setTimeout(() => loadSDK(attempt + 1), attempt * 1000);
            } else {
              reject(new Error("Failed to load official Pi SDK after 3 attempts"));
            }
          };

          document.head.appendChild(script);
        };

        loadSDK();
      });

      window.__PI_READY.catch(error => {
        console.error("Pi SDK initialization failed:", error);
      });
    </script>

    <title>React App</title>
    <script type="module" crossorigin src="/assets/index-CwkyBPYz.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CvWrECnX.css">
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- Vite entry -->
  </body>
</html>
